# Output: Finds hooks that only return a React Query call.
# Input: TypeScript source with `use*` functions returning `useQuery(...)`.
# Position: Owned by architecture hygiene scans to expose thin query wrapper facades.

id: generated-query-wrapper
language: TypeScript
severity: warning
message: Hook only returns useQuery(...); verify it owns real feature semantics instead of hiding generated query ownership.
rule:
  pattern: function $FUNC($$$ARGS) { return useQuery($$$QUERY_ARGS) }
constraints:
  FUNC:
    regex: ^use[A-Z].*
