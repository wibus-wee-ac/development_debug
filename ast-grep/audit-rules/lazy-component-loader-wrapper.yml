# Output: Finds lazy component loaders that only adapt an import to a default export.
# Input: TypeScript route/tab loader files.
# Position: Owned by architecture hygiene scans to expose loader-only compatibility surfaces.

id: lazy-component-loader-wrapper
language: TypeScript
severity: warning
message: Loader only adapts a component import/default export; verify the loader is still an owned boundary.
rule:
  any:
    - pattern: function $FUNC($$$ARGS) { return import($PATH).then($CALLBACK) }
    - pattern: function $FUNC($$$ARGS) { return Promise.resolve($VALUE) }
constraints:
  FUNC:
    regex: ^load[A-Z].*
