# Output: Finds TSX formatter/read/normalize helpers that only delegate to another formatter.
# Input: TSX helper functions returning a same-family helper call.
# Position: Owned by cleanup scans to expose useless conversion wrapper functions.

id: formatter-delegation-wrapper-tsx
language: TSX
severity: warning
message: Helper only delegates to another formatter/helper; remove the wrapper and call the target directly.
rule:
  pattern: "function $FUNC($$$ARGS): string { return $TARGET($$$CALL_ARGS) }"
constraints:
  FUNC:
    regex: ^(format|read|to|as|normalize|map)[A-Z].*
  TARGET:
    regex: ^(format|read|to|as|normalize|map)[A-Z].*
