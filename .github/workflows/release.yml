name: Release

# Trigger: pushing a semver tag (e.g. v1.2.3)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write   # needed to create GitHub releases and upload assets

jobs:
  # ─── Create the GitHub Release shell first ──────────────────────────────
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create.outputs.id }}
      upload-url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release (draft)
        id: create
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              draft: true,
              prerelease: tag.includes('-'),
              generate_release_notes: true,
            })
            core.setOutput('id', release.id)
            core.setOutput('upload_url', release.upload_url)
            console.log(`Created draft release ${release.html_url}`)

  # ─── Platform matrix build ───────────────────────────────────────────────
  build:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: create-release
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (arm64)
            os: macos-latest       # Apple Silicon
            args: '--mac --arm64'
            artifact-glob: 'dist/*.dmg'

          - name: macOS (x64)
            os: macos-13           # Intel — parity for older macs
            args: '--mac --x64'
            artifact-glob: 'dist/*.dmg'

          - name: Windows
            os: windows-latest
            args: '--win'
            artifact-glob: 'dist/*.exe'

          - name: Linux
            os: ubuntu-latest
            args: '--linux'
            artifact-glob: 'dist/*.AppImage'

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # Use official Electron mirror on CI (avoids Chinese CDN outside mainland)
      - name: Set Electron mirror (CI)
        shell: bash
        run: echo "ELECTRON_MIRROR=https://github.com/electron/electron/releases/download/" >> "$GITHUB_ENV"

      # Typecheck + build app bundle (no E2E in release path)
      - name: Build Electron app
        run: pnpm build
        env:
          # Disable code signing on CI (configure via env vars for notarization)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Package with electron-builder for the target platform
      - name: Package (${{ matrix.name }})
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # macOS notarization (optional — set in repo secrets to enable)
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Upload built artifacts to this GitHub Actions run for inspection
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}-${{ github.ref_name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 30

      # Attach installable to the draft GitHub Release
      - name: Attach to GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const path = require('path')
            const glob = require('glob').sync ?? require('@actions/glob').create

            const extensions = ['.dmg', '.exe', '.AppImage', '.deb', '.snap', '.zip']
            const distFiles = fs.readdirSync('dist').filter(f =>
              extensions.some(ext => f.endsWith(ext))
            )

            for (const file of distFiles) {
              const filePath = path.join('dist', file)
              const data = fs.readFileSync(filePath)
              console.log(`Uploading ${file} (${data.length} bytes)`)
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: parseInt(process.env.RELEASE_ID),
                name: file,
                data,
              })
            }

  # ─── Publish the draft release after all platforms succeed ──────────────
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build]
    if: success()
    steps:
      - name: Publish (undraft) release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              draft: false,
            })
            console.log('Release published.')
