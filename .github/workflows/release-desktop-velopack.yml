name: Release Desktop Velopack

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v, for example 1.2.3'
        required: true
      update_url:
        description: 'Velopack feed URL embedded into the Desktop app'
        required: true

permissions:
  contents: write

concurrency:
  group: release-desktop-velopack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop Velopack (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            builderTarget: mac
            builderArch: arm64
            packDir: release/mac-arm64/Cradle.app
            mainExe: Cradle
            icon: ../../build/icon.icns
          - os: windows-latest
            platform: win
            builderTarget: win
            builderArch: x64
            packDir: release/win-unpacked
            mainExe: Cradle.exe
            icon: ../../build/icon.ico
          - os: ubuntu-latest
            platform: linux
            builderTarget: linux
            builderArch: x64
            packDir: release/linux-unpacked
            mainExe: Cradle
            icon: ../../build/icon.png

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          node-version: 24

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install --global vpk --version 0.0.1589-ga2c5a97

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Resolve release inputs
        id: release
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if [ -n "${{ github.event.inputs.update_url }}" ]; then
            UPDATE_URL="${{ github.event.inputs.update_url }}"
          else
            UPDATE_URL="${{ vars.CRADLE_DESKTOP_UPDATE_URL }}"
          fi

          if [ -z "$UPDATE_URL" ]; then
            echo "CRADLE_DESKTOP_UPDATE_URL repository variable or workflow input is required" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "update_url=$UPDATE_URL" >> "$GITHUB_OUTPUT"

      - name: Build Desktop
        env:
          CRADLE_DESKTOP_UPDATE_URL: ${{ steps.release.outputs.update_url }}
          CRADLE_ELECTRON_REBUILD_ARCH: ${{ matrix.builderArch }}
        run: pnpm build:desktop

      - name: Package unpacked app
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: pnpm exec electron-builder --${{ matrix.builderTarget }} dir --${{ matrix.builderArch }} --publish never

      - name: Create Velopack release
        working-directory: apps/desktop
        shell: bash
        run: |
          mkdir -p out/Releases
          vpk pack \
            --packId com.cradle.app \
            --packVersion "${{ steps.release.outputs.version }}" \
            --packDir "${{ matrix.packDir }}" \
            --mainExe "${{ matrix.mainExe }}" \
            --packAuthors "Cradle" \
            --packTitle "Cradle" \
            --icon "${{ matrix.icon }}" \
            --outputDir out/Releases

      - name: Upload Velopack feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.platform }}-${{ steps.release.outputs.version }}
          path: apps/desktop/out/Releases/**
          retention-days: 30

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ steps.release.outputs.version }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.zip
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v$VERSION"
          else
            TAG="$GITHUB_REF_NAME"
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          prerelease: ${{ contains(steps.release.outputs.version, '-') }}
          generate_release_notes: true
          files: release-assets/**/*
