name: Windows Full Desktop Debug

on:
  push:
    branches:
      - 'codex/windows-server-startup-fulltest-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-full-desktop-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  CRADLE_DESKTOP_UPDATE_URL: https://github.com/wibus-wee-ac/development_debug/releases/download/feed-dev/manifest.json

jobs:
  windows-full:
    name: Windows packaged and installed app
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Setup desktop build environment
        uses: ./.github/actions/desktop-build-setup
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build desktop runtime and bundles
        run: pnpm --filter @cradle/desktop build
        env:
          CRADLE_ELECTRON_REBUILD_ARCH: x64
          GITHUB_TOKEN: ${{ github.token }}

      - name: Package unpacked Windows app
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.mjs --win --x64 --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CRADLE_ELECTRON_REBUILD_ARCH: x64
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify Windows desktop runtime manifest
        shell: pwsh
        run: |
          $manifestPath = "apps/server/dist/desktop-runtime/desktop-runtime.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest | ConvertTo-Json -Depth 10
          if ($manifest.electron.platform -ne "win32") {
            throw "Expected desktop runtime platform win32, got $($manifest.electron.platform)"
          }
          if ($manifest.electron.arch -ne "x64") {
            throw "Expected desktop runtime arch x64, got $($manifest.electron.arch)"
          }

      - name: Audit app-local VC runtime dependencies
        id: vc_audit
        continue-on-error: true
        shell: pwsh
        run: |
          $appRoot = Resolve-Path "apps/desktop/release/win-unpacked"
          $serverNodeModules = Join-Path $appRoot "resources/server/node_modules"
          $nativeFiles = Get-ChildItem $serverNodeModules -Recurse -File -Include *.node,*.dll
          if ($nativeFiles.Count -eq 0) {
            throw "No native .node/.dll files found in packaged server runtime."
          }

          $dumpbin = Get-ChildItem "C:/Program Files/Microsoft Visual Studio/2022" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            Write-Warning "dumpbin.exe was not found; skipping native Windows runtime dependency audit."
            exit 0
          }

          $runtimeDllPattern = '^(VCRUNTIME|MSVCP|CONCRT)[A-Z0-9_]*\.dll$'
          $required = New-Object 'System.Collections.Generic.HashSet[string]'
          foreach ($file in $nativeFiles) {
            $output = & $dumpbin.FullName /dependents $file.FullName
            foreach ($line in $output) {
              $dll = $line.Trim()
              if ($dll -match $runtimeDllPattern) {
                [void]$required.Add($dll.ToUpperInvariant())
              }
            }
          }

          if ($required.Count -eq 0) {
            Write-Host "No VC runtime DLL dependencies detected in packaged native files."
            exit 0
          }

          $present = Get-ChildItem $appRoot -File |
            ForEach-Object { $_.Name.ToUpperInvariant() }
          $missing = @()
          foreach ($dll in $required) {
            if ($present -notcontains $dll) {
              $missing += $dll
            }
          }

          Write-Host "Required VC runtime DLLs: $($required -join ', ')"
          Write-Host "App root DLLs: $($present -join ', ')"
          if ($missing.Count -gt 0) {
            throw "Native server runtime depends on VC runtime DLLs that are not app-local: $($missing -join ', ')"
          }

      - name: Launch win-unpacked app e2e
        id: unpacked_e2e
        continue-on-error: true
        run: node .github/scripts/windows-packaged-e2e.mjs
        env:
          CRADLE_E2E_ARTIFACT_NAME: win-unpacked

      - name: Build Windows NSIS installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.mjs --win nsis --x64 --publish never --config.compression=normal
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CRADLE_ELECTRON_REBUILD_ARCH: x64
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install NSIS package silently
        id: install
        shell: pwsh
        run: |
          $installer = Resolve-Path "apps/desktop/release/Cradle-setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "CradleInstall"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $installDir | Out-Null
          Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installDir" -Wait -NoNewWindow
          $exe = Join-Path $installDir "Cradle.exe"
          if (!(Test-Path $exe)) {
            Get-ChildItem $installDir -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            throw "Installed Cradle.exe was not found at $exe"
          }
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Launch installed app e2e
        id: installed_e2e
        continue-on-error: true
        run: node .github/scripts/windows-packaged-e2e.mjs
        env:
          CRADLE_E2E_ARTIFACT_NAME: installed
          CRADLE_E2E_EXE_PATH: ${{ steps.install.outputs.exe }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-full-desktop-debug
          if-no-files-found: warn
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/builder-effective-config.yaml
            apps/server/dist/desktop-runtime/desktop-runtime.json
            e2e/artifacts/windows-packaged-e2e/**

      - name: Fail on debug failures
        if: always()
        shell: pwsh
        env:
          VC_AUDIT_OUTCOME: ${{ steps.vc_audit.outcome }}
          UNPACKED_E2E_OUTCOME: ${{ steps.unpacked_e2e.outcome }}
          INSTALLED_E2E_OUTCOME: ${{ steps.installed_e2e.outcome }}
        run: |
          $failures = @()
          if ($env:VC_AUDIT_OUTCOME -eq "failure") {
            $failures += "VC runtime audit"
          }
          if ($env:UNPACKED_E2E_OUTCOME -eq "failure") {
            $failures += "win-unpacked e2e"
          }
          if ($env:INSTALLED_E2E_OUTCOME -eq "failure") {
            $failures += "installed e2e"
          }
          if ($failures.Count -gt 0) {
            throw "Windows full desktop debug failed: $($failures -join ', ')"
          }
