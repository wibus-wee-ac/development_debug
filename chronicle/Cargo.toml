[package]
name = "cradle-chronicle"
version = "0.1.0"
edition = "2024"
description = "Cradle-owned passive context and memory pipeline"
license = "UNLICENSED"

[lib]
name = "cradle_chronicle"
path = "src/lib.rs"

[[bin]]
name = "cradle-chronicle"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-graphics-types = "0.2"
core-foundation = "0.10"
foreign-types = "0.5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSError", "NSObject"] }
block2 = "0.6"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
